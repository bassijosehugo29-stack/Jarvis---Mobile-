name: JARVIS - nome, icone e escuta (base disponivel)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    # GitHub-hosted runners are free for public repos; see README for private quotas.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mobile_url: ${{ steps.mobile_apk.outputs.artifact-url }}
    env:
      JARVIS_KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
      JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
      JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
      JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar assinatura privada quando configurada
        run: python3 scripts/prepare_signing.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar modelo aprovado e motor local da voz A
        run: |
          python -m pip install onnx==1.18.0
          python scripts/prepare_voice_a.py
      - name: Verificar estrutura
        run: python3 scripts/check_project.py
      - name: Verificar escopo e preservação da base disponível
        run: python3 scripts/check_preservation.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Gerar wrapper oficial e compilar
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :voice-engine:testDebugUnitTest :app:lintDebug :app:lintPreservation :voice-engine:lintDebug :app:assemblePreservation :app:assembleDebug :voice-engine:assembleDebug :app:assembleDebugAndroidTest
      - name: Verificar APK isolado, nome, assinatura e bibliotecas de 16 KB
        env:
          JARVIS_MAIN_APK: app/build/outputs/apk/preservation/app-preservation.apk
          JARVIS_EXPECTED_PACKAGE: br.com.jarvis.mobile.preservacaopreview
        run: python3 scripts/verify_apk.py
      - name: Preparar APK técnico e aviso de referência ausente
        run: |
          mkdir -p build/apk
          cp app/build/outputs/apk/preservation/app-preservation.apk build/apk/JARVIS-teste-base-disponivel.apk
          cp docs/AVISO-TESTE-TECNICO.txt build/apk/LEIA-ANTES-DE-INSTALAR.txt
      - name: Guardar APK técnico da base disponível (não é CyberBot verificado)
        id: mobile_apk
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-teste-tecnico-base-disponivel
          path: build/apk/
          if-no-files-found: error
          retention-days: 90
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-relatorios
          path: |
            app/build/reports/
            voice-engine/build/reports/
            build/verification/
          if-no-files-found: ignore
          retention-days: 90

  android-tests:
    name: Testes instrumentados Android 35
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JARVIS_KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
      JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
      JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
      JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar assinatura privada quando configurada
        run: python3 scripts/prepare_signing.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar modelo aprovado e motor local da voz A
        run: |
          python -m pip install onnx==1.18.0
          python scripts/prepare_voice_a.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: SDK e NDK para conversa local
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Modelo gratuito para o teste real de conversa
        run: python3 scripts/fetch_test_model.py /tmp/jarvis-conversation-model.gguf
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - name: Habilitar KVM no runner Linux
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gerar wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          chmod +x gradlew
      - name: Testar tela e intents no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: |
            adb push /tmp/jarvis-conversation-model.gguf /data/local/tmp/jarvis-conversation-model.gguf
            adb shell chmod 644 /data/local/tmp/jarvis-conversation-model.gguf
            sh scripts/test_on_emulator.sh
      - name: Guardar resultados instrumentados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-testes-instrumentados
          path: |
            app/build/reports/
            voice-engine/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 90

  verify-downloads:
    name: Verificar downloads publicados
    needs: [debug-apk, android-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Baixar o artifact publicado do teste técnico
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-teste-tecnico-base-disponivel
          path: downloaded/mobile
      - name: Baixar os comprovantes da compilação
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-relatorios
          path: downloaded/reports
      - name: Conferir APKs realmente baixados e gerar links
        env:
          JARVIS_MOBILE_ARTIFACT_URL: ${{ needs['debug-apk'].outputs.mobile_url }}
        run: python3 scripts/verify_apk_downloads.py
      - name: Guardar comprovante e instruções de download
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-comprovante-downloads
          path: build/download-verification/
          if-no-files-found: error
          retention-days: 90
