name: Android - APK de teste

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    # GitHub-hosted runners are free for public repos; see README for private quotas.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verificar estrutura
        run: python3 scripts/check_project.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Gerar wrapper oficial e compilar
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Guardar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-relatorios
          path: |
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  android-tests:
    name: Testes instrumentados Android 35
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: SDK e NDK para conversa local
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Modelo gratuito para o teste real de conversa
        run: python3 scripts/fetch_test_model.py /tmp/jarvis-conversation-model.gguf
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - name: Habilitar KVM no runner Linux
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gerar wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          chmod +x gradlew
      - name: Testar tela e intents no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            adb push /tmp/jarvis-conversation-model.gguf /data/local/tmp/jarvis-conversation-model.gguf
            adb shell chmod 644 /data/local/tmp/jarvis-conversation-model.gguf
            ./gradlew --no-daemon --max-workers=2 connectedDebugAndroidTest
            mkdir -p app/build/reports/screenshots
            adb pull /sdcard/Pictures/JARVIS/. app/build/reports/screenshots/
            mkdir -p app/build/reports/conversation
            adb pull /sdcard/Download/JARVIS-testes/. app/build/reports/conversation/
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put global animator_duration_scale 1
            adb shell am start -W -n br.com.jarvis.mobile/.MainActivity
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell screenrecord --size 720x1600 --bit-rate 2500000 --time-limit 6 /sdcard/jarvis-hud.mp4
            adb pull /sdcard/jarvis-hud.mp4 app/build/reports/screenshots/jarvis-hud.mp4
      - name: Guardar resultados instrumentados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-testes-instrumentados
          path: |
            app/build/reports/androidTests/
            app/build/reports/screenshots/
            app/build/reports/conversation/
          if-no-files-found: ignore
          retention-days: 7
