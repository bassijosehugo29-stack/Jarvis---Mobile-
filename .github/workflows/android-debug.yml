name: Android - APK de teste

on:
  workflow_dispatch:
  push:
    branches: [main, master, jarvis-4-fase1]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    # GitHub-hosted runners are free for public repos; see README for private quotas.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mobile_url: ${{ steps.mobile_apk.outputs.artifact-url }}
      voice_url: ${{ steps.voice_apk.outputs.artifact-url }}
      sources_url: ${{ steps.voice_sources.outputs.artifact-url }}
    env:
      ORG_GRADLE_PROJECT_jarvisAbis: arm64-v8a
      JARVIS_KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
      JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
      JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
      JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar assinatura privada quando configurada
        run: python3 scripts/prepare_signing.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar modelo aprovado e motor local da voz A
        run: |
          python -m pip install onnx==1.18.0
          python scripts/prepare_voice_a.py
      - name: Verificar estrutura
        run: python3 scripts/check_project.py
      - name: Verificar disponibilidade das fontes públicas
        run: python3 scripts/probe_public_sources.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Gerar wrapper oficial e compilar
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :voice-engine:testDebugUnitTest :app:lintDebug :voice-engine:lintDebug :app:lintPreview :voice-engine:lintPreview :app:assemblePreview :voice-engine:assemblePreview :app:assembleDebugAndroidTest
      - name: Verificar APK, assinatura e bibliotecas de 16 KB
        env:
          JARVIS_BUILD_VARIANT: preview
        run: python3 scripts/verify_apk.py
      - name: Preparar entrega dos dois APKs
        run: |
          mkdir -p build/apk
          cp app/build/outputs/apk/preview/app-preview.apk build/apk/JARVIS-Mobile-4.0.0-fase1-preview.apk
          cp voice-engine/build/outputs/apk/preview/voice-engine-preview.apk build/apk/JARVIS-Voz-A-4-preview.apk
          cp docs/INSTALAR-VOZ-A.txt build/apk/LEIA-ME.txt
      - name: Fontes correspondentes do motor de voz
        run: python3 scripts/bundle_voice_a_source.py
      - name: Guardar fontes correspondentes da voz A
        id: voice_sources
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Voz-A-fontes
          path: build/voice-source/JARVIS-Voz-A-fontes.zip
          retention-days: 90
          if-no-files-found: error
      - name: Publicar APK JARVIS Voz A para download
        id: voice_apk
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Voz-A-4-Preview-APK
          path: build/apk/JARVIS-Voz-A-4-preview.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publicar APK JARVIS 4 Fase 1 para download
        id: mobile_apk
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-4-Fase1-APK
          path: build/apk/JARVIS-Mobile-4.0.0-fase1-preview.apk
          if-no-files-found: error
          retention-days: 90
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-relatorios
          path: |
            app/build/reports/
            voice-engine/build/reports/
            build/verification/
          if-no-files-found: ignore
          retention-days: 90

  android-tests:
    name: Testes instrumentados Android 35
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JARVIS_KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
      JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
      JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
      JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar assinatura privada quando configurada
        run: python3 scripts/prepare_signing.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar modelo aprovado e motor local da voz A
        run: |
          python -m pip install onnx==1.18.0
          python scripts/prepare_voice_a.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: SDK e NDK para conversa local
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: APK 3.1 de referência para medição comparável
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: 40717061024
          name: JARVIS-Mobile-3.1-APK
          path: baseline
      - name: Motor 3.1 de referência para medição comparável
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: 40717061024
          name: JARVIS-Voz-A-APK
          path: baseline-voice
      - name: Modelo gratuito para o teste real de conversa
        run: python3 scripts/fetch_test_model.py /tmp/jarvis-conversation-model.gguf
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - name: Habilitar KVM no runner Linux
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gerar wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          chmod +x gradlew
      - name: Testar tela e intents no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: |
            adb push /tmp/jarvis-conversation-model.gguf /data/local/tmp/jarvis-conversation-model.gguf
            adb shell chmod 644 /data/local/tmp/jarvis-conversation-model.gguf
            sh scripts/test_on_emulator.sh
      - name: Guardar resultados instrumentados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-testes-instrumentados
          path: |
            app/build/reports/
            voice-engine/build/reports/androidTests/
            app/build/reports/
            voice-engine/build/reports/screenshots/
            app/build/reports/
            voice-engine/build/reports/conversation/
          if-no-files-found: ignore
          retention-days: 90
      - name: Guardar demonstração e métricas da fase 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-4-Visual-Performance
          path: |
            app/build/reports/screenshots/
            app/build/reports/performance/
            app/build/reports/conversation/jarvis-v4-render-metrics.json
          if-no-files-found: ignore
          retention-days: 90

  verify-downloads:
    name: Verificar downloads publicados
    needs: [debug-apk, android-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Baixar o artifact publicado da voz A
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Voz-A-4-Preview-APK
          path: downloaded/voice
      - name: Baixar o artifact publicado do assistente
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-4-Fase1-APK
          path: downloaded/mobile
      - name: Baixar os comprovantes da compilação
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-relatorios
          path: downloaded/reports
      - name: Conferir APKs realmente baixados e gerar links
        env:
          JARVIS_MOBILE_ARTIFACT_URL: ${{ needs['debug-apk'].outputs.mobile_url }}
          JARVIS_VOICE_ARTIFACT_URL: ${{ needs['debug-apk'].outputs.voice_url }}
          JARVIS_VOICE_SOURCES_URL: ${{ needs['debug-apk'].outputs.sources_url }}
        run: python3 scripts/verify_apk_downloads.py
      - name: Guardar comprovante e instruções de download
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-comprovante-downloads
          path: build/download-verification/
          if-no-files-found: error
          retention-days: 90
